name: CI/CD Deployment Pipeline

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Build
        run: |
          npm install
          npm run build
          zip -r build.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
          
      - name: Generate AI Release Notes Agent
        run: |
          echo "🤖 AI Agent is summarizing recent commits for release notes..."
          # 利用 git log 自動抓取最近的 commit 記錄作為 AI 代理的輸入
          RECENT_COMMITS=$(git log -n 5 --pretty=format:"- %s")
          echo "### Release Notes (Generated by AI Agent)" > release-notes.md
          echo "" >> release-notes.md
          echo "Here are the recent updates included in this version:" >> release-notes.md
          echo "$RECENT_COMMITS" >> release-notes.md
          cat release-notes.md

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      # 👇 新增：從 package.json 動態讀取版本號
      - name: Read version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=staging-v$VERSION" >> $GITHUB_ENV
          echo "Released version is staging-v$VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.TAG }}" build.zip \
            --title "Release ${{ env.TAG }}" \
            --notes "${{ vars.RELEASE_NOTE }}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      # 👇 新增：從 package.json 動態讀取版本號（Production 也可以用相同邏輯或加上 prod 前綴）
      - name: Read version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "TAG=prod-v$VERSION" >> $GITHUB_ENV
          echo "Released version is prod-v$VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 嘗試刪除遠端已存在的同名 Release 與 Tag（若不存在則忽略錯誤繼續）
          gh release delete "${{ env.TAG }}" --yes || true
          git push origin --delete "${{ env.TAG }}" || true

          # 重新建立 Release
          gh release create "${{ env.TAG }}" build.zip \
            --title "Release ${{ env.TAG }}" \
            --notes "${{ vars.RELEASE_NOTE }}"
