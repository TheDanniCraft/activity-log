
name: Assignment 4 Deployment Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build with Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
           ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint commit message
        run: bun run lint:commit

      - name: Build project
        run: bun run build
      - name: Validate build artifact
        run: |
          echo "Checking build output..."
          test -s dist/index.js
          test -s dist/licenses.txt
          test -s dist/package.json
          echo "Build artifact validation passed!"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: activity-log-build
          path: |
            dist/
            action.yml
          if-no-files-found: error
          retention-days: 7


  release-dev:
    name: Release to Dev
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build
          path: release-files

      - name: Package release files
        run: |
          cd release-files
          zip -r ../activity-log-build.zip .

      - name: Create Dev GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${BUILD_TAG%%-v*}-v${VERSION}-run${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" activity-log-build.zip \
            --target "$GITHUB_SHA" \
            --title "Dev Release $TAG" \
            --notes "$RELEASE_NOTE" \
            --prerelease

            
  release-staging:
    name: Release to Staging
    needs: release-dev
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build
          path: release-files

      - name: Package release files
        run: |
          cd release-files
          zip -r ../activity-log-build.zip .

      - name: Create Staging GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${BUILD_TAG%%-v*}-v${VERSION}-run${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" activity-log-build.zip \
            --target "$GITHUB_SHA" \
            --title "Staging Release $TAG" \
            --notes "$RELEASE_NOTE" \
            --prerelease

  ai-review:
    name: AI Pre-deploy Review
    needs: release-staging
    runs-on: ubuntu-latest
    environment: ai-review

    permissions:
      contents: read
      copilot-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot
      - name: Run AI risk review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ai_predeploy_review.py

      - name: Upload AI review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-predeploy-review
          path: ai-review-report.md
          if-no-files-found: warn
          retention-days: 30


  release-production:
    name: Release to Production
    needs: ai-review
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: activity-log-build
          path: release-files

      - name: Package release files
        run: |
          cd release-files
          zip -r ../activity-log-build.zip .

      - name: Create Production GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTE: ${{ vars.RELEASE_NOTE }}
          BUILD_TAG: ${{ vars.BUILD_TAG }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${BUILD_TAG%%-v*}-v${VERSION}-run${GITHUB_RUN_NUMBER}-attempt${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" activity-log-build.zip \
            --target "$GITHUB_SHA" \
            --title "Production Release $TAG" \
            --notes "$RELEASE_NOTE"