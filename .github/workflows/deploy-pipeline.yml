name: Build-Test-Release Pipeline

on: 
  push:
    branches: [ main ] # 請確認您的分支名稱是 master 還是 main
  workflow_dispatch:

jobs:
  # 1. 建置階段
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm install -g bun
          npm install
          npm run build
          zip -r build.zip .
      - uses: actions/upload-artifact@v4
        with: { name: build-artifact, path: build.zip }

  # 2. 單元測試階段 (O級加分：使用 Matrix 同時測試 Node 20 與 22)
  test-unit:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22] # 同時開兩台虛擬機跑不同版本
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node-version }}' }
      - uses: actions/download-artifact@v4
        with: { name: build-artifact }
      - run: unzip -o build.zip
      - name: 執行單元測試
        run: npm run test:unit

  # 3. 整合測試階段 (E級要求：獨立的測試階段)
  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: build-artifact }
      - run: unzip -o build.zip
      - name: 執行整合測試
        run: npm run test:integration

  # 4. 發布至開發環境 (必須等測試通過)
  deploy-dev:
    needs: test-integration
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-artifact }
      - name: 建立 Dev Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: gh release create "$TAG" build.zip --notes "$NOTE" --title "$TAG"

  # (若要完整，可再接續寫 deploy-staging 與 deploy-production，寫法與作業四相同，只需注意 needs 要指向上一個階段)
