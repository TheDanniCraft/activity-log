
name: Assignment 5 - Automated Testing

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install and Build
        run: |
          bun install --frozen-lockfile
          bun run build

      - uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/
          if-no-files-found: error

  unit-test:
    name: Unit Test - Node ${{ matrix.node }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run Unit Tests and Generate JUnit
        run: |
          mkdir -p reports
          node --test \
            --test-reporter=spec \
            --test-reporter-destination=stdout \
            --test-reporter=junit \
            --test-reporter-destination=reports/unit.xml \
            test/unit.test.js

      - name: Upload Unit Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-report-node-${{ matrix.node }}
          path: reports/unit.xml
          if-no-files-found: warn

  integration-test:
    name: Integration Test and Coverage
    needs: unit-test
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Run Integration Tests
        run: npm run test:integration

      - name: Generate Coverage and Enforce Gate
        run: |
          mkdir -p reports
          npm run test:coverage > reports/coverage.txt 2>&1 || {
            cat reports/coverage.txt
            exit 1
          }
          cat reports/coverage.txt

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage.txt
          if-no-files-found: warn

  deploy-staging:
    name: Deploy Staging
    needs: integration-test
    runs-on: ubuntu-latest
    environment: staging
    env:
      TEST_ENV: staging

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Verify Staging Artifact
        run: |
          test -f dist/index.js
          echo "Staging deployment simulation passed"

  
  deploy-production:
    name: Deploy Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      TEST_ENV: production
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: dist/

      - name: Verify Production Artifact
        run: |
          test -f dist/index.js
          echo "Production artifact verified successfully"

      - name: Package Production Artifact
        run: |
          tar -czf production-build.tar.gz -C dist .

      - name: Create GitHub Release
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            production-build.tar.gz \
            --title "Production Release v1.0.${{ github.run_number }}" \
            --notes "Automated release after successful unit tests, integration tests, coverage checks, staging verification, and production approval."

