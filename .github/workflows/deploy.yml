name: CI Dev Deployment

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build
        run: |
          npm install
          npm run build
          zip -r build.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write          # needed to create a release
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Dev Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # gh needs this when there is no checkout
          RAW_TAG: ${{ vars.BUILD_TAG }} # <--- 防呆段落開始：先將環境變數存入 RAW_TAG
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: |
          TAG=$(echo "$RAW_TAG" | xargs) # <--- 核心防呆：自動過濾並修剪掉頭尾多餘的空白字元
          gh release create "$TAG" build.zip --notes "$NOTE"
