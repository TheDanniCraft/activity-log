name: CI/CD Deployment Pipeline

on:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install and build
        run: |
          bun install
          bun run build

      - name: Package build artifact
        run: zip -r build.zip . -x ".git/*" "node_modules/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  test-unit:
    name: Test (Unit)
    needs: build
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Run unit tests
        run: |
          echo "Running unit tests against TEST_ENV=$TEST_ENV ..."
          node test/unit.test.js

  test-integration:
    name: Test (Integration)
    needs: test-unit
    runs-on: ubuntu-latest
    env:
      TEST_ENV: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Run integration tests
        run: |
          echo "Running integration tests against TEST_ENV=$TEST_ENV ..."
          node test/integration.test.js

  deploy-staging:
    name: Deploy to Staging
    needs: test-integration
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://github.com/${{ github.repository }}/releases/tag/${{ vars.BUILD_TAG }}-staging-${{ github.run_number }}
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create staging release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}-staging-${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: gh release create "$TAG" build.zip --title "$TAG" --notes "$NOTE"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}/releases/tag/${{ vars.BUILD_TAG }}-prod-${{ github.run_number }}
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Create production release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG }}-prod-${{ github.run_number }}
          NOTE: ${{ vars.RELEASE_NOTE }}
        run: gh release create "$TAG" build.zip --title "$TAG" --notes "$NOTE"
