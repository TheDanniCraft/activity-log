name: CI Dev Deployment

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 安裝專案需要的 bun 環境
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # 執行專案原本的安裝與建置指令
      - name: Build
        run: |
          npm install
          npm run build
          zip -r build.zip . -x ".git/*" ".github/*"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: write          # 建立 release 所需權限
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Dev Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ vars.BUILD_TAG || 'dev-v1.0' }}
          NOTE: ${{ vars.RELEASE_NOTE || 'Development build release' }}
        run: |
          echo "Deploying release with tag: $TAG"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" build.zip --title "Dev Release $TAG" --notes "$NOTE"
